<!doctype html>
<!--
  Tooltip Hover Delay Comparison — rebuild of the design by Juliette (@shedsgns)
  Source: https://x.com/shedsgns/status/2112265023464603894
  Nothing sampled from the clip: every surface, icon, cursor, spinner and shadow is drawn in CSS / inline SVG.
  ?demo=1 replays the clip's 15.98 s sequence with element.animate (seekable); without it the toolbars answer the pointer.
-->
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Indie+Flower&display=swap" rel="stylesheet">
<style>
@property --ms{syntax:'<integer>';inherits:true;initial-value:500}
@property --w{syntax:'<integer>';inherits:true;initial-value:0}
@property --e{syntax:'<integer>';inherits:true;initial-value:0}
html,body{margin:0;overflow:hidden;background:#fdfdfd}
#stage{--u:1px;position:relative;width:calc(1440*var(--u));height:calc(1080*var(--u));background:#fdfdfd;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#1a1a1a}
.page{position:absolute;inset:0;background:#f2f2f2}
.card{position:absolute;left:calc(48*var(--u));width:calc(1344*var(--u));height:calc(480*var(--u));background:#fff;border-radius:calc(40*var(--u))}
.content{position:absolute;inset:0}
.title{position:absolute;left:calc(40*var(--u));top:calc(35*var(--u));font:400 calc(30*var(--u))/1 'Indie Flower',cursive;letter-spacing:calc(1.5*var(--u));word-spacing:calc(2*var(--u));-webkit-text-stroke:calc(.7*var(--u)) currentColor}
.ctr{position:absolute;right:calc(40*var(--u));top:calc(37*var(--u));font:400 calc(21*var(--u))/1 Inter;color:#646366;--a:calc(round(down,var(--w)/10,1));--b:calc(mod(var(--w),10))}
.ctr::before{counter-reset:a var(--a) b var(--b);content:counter(a) "." counter(b) "s waiting"}
.bar{position:absolute;left:calc(326*var(--u));top:calc(181*var(--u));width:calc(691*var(--u));height:calc(78*var(--u));background:#fff;border-radius:calc(18*var(--u));box-shadow:0 calc(10*var(--u)) calc(30*var(--u)) rgba(0,0,0,.13),0 calc(2*var(--u)) calc(6*var(--u)) rgba(0,0,0,.06)}
.body{position:absolute;left:calc(21*var(--u));top:0;height:100%;display:flex;align-items:center;gap:calc(5*var(--u));font:400 calc(23*var(--u))/1 Inter;color:#2a2a2a}
.body svg{width:calc(18*var(--u));height:calc(18*var(--u))}
.div{position:absolute;top:calc(24*var(--u));width:calc(1.5*var(--u));height:calc(30*var(--u));background:#e6e6e8}
.btn{position:absolute;top:calc(7*var(--u));width:calc(64*var(--u));height:calc(62*var(--u));margin-left:calc(-32*var(--u));display:grid;place-items:center;font:calc(25*var(--u))/1 Inter}
.btn svg{width:calc(31*var(--u));height:calc(31*var(--u));fill:none;stroke:#1a1a1a;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sq{position:absolute;inset:0;border-radius:calc(12*var(--u));background:#efeff2;opacity:0}
.btn b,.btn i,.btn u,.btn s,.btn svg{position:relative}
.btn b{font-weight:700}.btn i{font-weight:500;font-style:italic}.btn u{font-weight:600;text-underline-offset:calc(4*var(--u));text-decoration-thickness:calc(2*var(--u))}.btn s{font-weight:600;text-decoration-thickness:calc(2*var(--u))}
.dot{position:absolute;left:calc(640*var(--u));top:calc(27*var(--u));width:calc(24*var(--u));height:calc(24*var(--u));border-radius:50%}
.tip{position:absolute;bottom:calc(81*var(--u));left:50%;transform:translateX(-50%);height:calc(43*var(--u));padding:0 calc(17*var(--u));display:flex;align-items:center;gap:calc(9*var(--u));white-space:nowrap;background:#151515;color:#fff;border-radius:calc(10*var(--u));font:500 calc(18*var(--u))/1 Inter;opacity:0;pointer-events:none}
.track{position:absolute;left:calc(40*var(--u));top:calc(430*var(--u));width:calc(1264*var(--u));height:calc(10*var(--u));border-radius:calc(5*var(--u));background:#eeeeef}
.seg{position:absolute;top:calc(430*var(--u));height:calc(10*var(--u));background:#45bdf0;width:calc(84*var(--u))}
.lab{position:absolute;left:0;top:calc(425*var(--u));font:500 calc(17*var(--u))/calc(20*var(--u)) Inter;color:#1a1a1a;--a:calc(round(down,var(--e)/10,1));--b:calc(mod(var(--e),10))}
.lab::before{counter-reset:a var(--a) b var(--b);content:counter(a) "." counter(b) "s"}
.cur{position:absolute;left:0;top:0;opacity:0;pointer-events:none}
.cur svg{position:absolute}
.cur svg{filter:drop-shadow(0 calc(1*var(--u)) calc(3*var(--u)) rgba(0,0,0,.35))}
.arrow{left:calc(-3.4*var(--u));top:calc(-3.4*var(--u));width:calc(32*var(--u));height:calc(44*var(--u))}
.hand{left:calc(-13*var(--u));top:calc(-2*var(--u));width:calc(36*var(--u));height:calc(45*var(--u));opacity:0}
.pill{position:absolute;left:calc(24*var(--u));top:calc(54*var(--u));display:flex;align-items:center;gap:calc(12*var(--u))}
.ring{width:calc(22*var(--u));height:calc(22*var(--u));border-radius:50%;background:conic-gradient(#45bdf0 calc((500 - var(--ms)) * .72deg),#d3edf8 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.4px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.4px))}
.ms{height:calc(28*var(--u));padding:0 calc(10*var(--u));border-radius:calc(8*var(--u));background:#e3f4fc;color:#2f87ab;font:500 calc(17*var(--u))/calc(28*var(--u)) Inter;counter-reset:m var(--ms)}
.ms::before{content:counter(m) "ms"}
/* pointer mode */
body:not(.demo) .btn:hover .sq{opacity:1}
body:not(.demo) .tip{transition:opacity .15s}
body:not(.demo) .btn:hover .tip{opacity:1;transition-delay:.5s}
body:not(.demo) .warm .btn:hover .tip{transition-delay:0s}
@media (prefers-reduced-motion:reduce){body:not(.demo) .tip{transition:none}}
</style></head>
<body><div id="stage"><div class="page"></div></div>
<script>
const D = 15.98, U = 'var(--u)', demo = new URLSearchParams(location.search).has('demo');
if (demo) document.body.classList.add('demo');
const ic = {
  link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1.2 1.2M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1.2-1.2"/>',
  code: '<path d="M8.5 6.5 3 12l5.5 5.5M15.5 6.5 21 12l-5.5 5.5"/>',
  quote: '<path d="M4 6.5h16M9.5 12h10.5M9.5 17.5h10.5M4.5 10.5v7"/>'
};
// [label, x in toolbar, tooltip, keys]
const BTNS = [
  ['<b>B</b>', 156, 'Bold', '⌘B'], ['<i>I</i>', 226, 'Italic', '⌘I'], ['<u>U</u>', 294, 'Underline', '⌘U'],
  ['<s>S</s>', 362, 'Strikethrough', '⌘⇧X'], ['link', 438, 'Link', '⌘K'], ['code', 506, 'Code', '⌘E'], ['quote', 574, 'Quote', '⌘⇧9']
];
const SEGS = [40, 216, 375, 535, 696, 855, 1014];
const px = n => `calc(${n} * ${U})`;
const CARDS = [
  { top: 48, title: 'Delay on every hover', col: '#d02f9e', w: 35, e: 69, segs: 7 },
  { top: 552, title: 'Delay once, then instant', col: '#4fd6a6', w: 5, e: 37, segs: 1 }
];
const cards = CARDS.map((c, ci) => {
  const el = document.createElement('div');
  el.className = 'card'; el.style.top = px(c.top);
  el.innerHTML = `<div class="content">
    <div class="title" style="color:${c.col}">${c.title}</div>
    <div class="ctr" style="--w:${c.w}"></div>
    <div class="bar">
      <div class="body">Body<svg viewBox="0 0 12 12"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="div" style="left:${px(118)}"></div><div class="div" style="left:${px(396)}"></div><div class="div" style="left:${px(612)}"></div>
      ${BTNS.map(([l, x, t, k]) => `<div class="btn" style="left:${px(x)}"><div class="sq"></div>${ic[l] ? `<svg viewBox="0 0 24 24">${ic[l]}</svg>` : l}<div class="tip"><span>${t}</span><span>${k}</span></div></div>`).join('')}
      <div class="dot" style="background:${c.col}"></div>
    </div>
    <div class="track"></div>
    ${SEGS.map((x, i) => `<div class="seg" style="left:${px(x)};${i < c.segs ? '' : 'width:0'}"></div>`).join('')}
    <div class="lab" style="--e:${c.e};transform:translateX(${px(40 + 16.8 * c.e + 9)})"></div>
  </div>
  <div class="cur"><svg class="arrow" viewBox="0 0 22 30"><path d="M2 2v22l5.5-5 3.6 8.2 3.2-1.4-3.5-7.9h7.4z" fill="#000" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg>
    <svg class="hand" viewBox="0 0 26 32"><path d="M8.2 3.2c0-2.4 4-2.4 4 0v8.6c.2-2 3.8-2 3.8.2v.8c.3-2 3.7-2 3.7.3v.9c.4-1.8 3.5-1.6 3.5.6v7.6c0 5.2-3.2 8.6-8.2 8.6h-2.2c-3.2 0-5-1.4-6.6-4L1.7 21c-1.2-2 1.2-3.9 3-2.2l3.5 3.2z" fill="#fff" stroke="#000" stroke-width="1.7" stroke-linejoin="round"/><path d="M12.2 11.8v3M16 12.8v2.3M19.7 14v1.8" stroke="#000" stroke-width="1.3" stroke-linecap="round"/></svg>
    <div class="pill"><div class="ring"></div><div class="ms"></div></div></div>`;
  document.getElementById('stage').append(el);
  const q = s => [...el.querySelectorAll(s)];
  return { el, content: q('.content')[0], ctr: q('.ctr')[0], btns: q('.btn'), sqs: q('.sq'), tips: q('.tip'), segs: q('.seg'), lab: q('.lab')[0], cur: q('.cur')[0], hand: q('.hand')[0], arrow: q('.arrow')[0], pill: q('.pill')[0] };
});

// pointer mode: the bottom toolbar waits once, then shows later tooltips at once until the pointer leaves it
const warmBar = cards[1].el.querySelector('.bar');
cards[1].tips.forEach(t => t.addEventListener('transitionend', () => { if (getComputedStyle(t).opacity === '1') warmBar.classList.add('warm'); }));
warmBar.addEventListener('mouseleave', () => warmBar.classList.remove('warm'));

// demo: [time, value(s)] points on the clip timeline, played by one seekable animation per property
function play(el, prop, pts, easing = 'linear') {
  const kf = [];
  pts.forEach(([t, v, ez]) => kf.push({ offset: Math.min(1, Math.max(0, t / D)), [prop]: v, easing: ez || easing }));
  kf.sort((a, b) => a.offset - b.offset);
  if (kf[0].offset > 0) kf.unshift({ ...kf[0], offset: 0 });
  if (kf[kf.length - 1].offset < 1) kf.push({ ...kf[kf.length - 1], offset: 1 });
  el.animate(kf, { duration: D * 1000, fill: 'both' });
}
const BTN_X = BTNS.map(b => 326 + b[1]);          // card-relative x of each button
const HOVER_Y = 234;                                // fingertip y over the toolbar
const tr = (x, y) => `translate(${px(x)}, ${px(y)})`;

function run(c, o) {
  const S = o.starts, n = S.length;
  const L = S.map((s, k) => k < n - 1 ? S[k + 1] - 0.06 : o.lastLeave);
  const E = S.map((s, k) => s + o.delay(k));
  // cursor path
  const cp = [[o.in, tr(o.rest[0], o.rest[1])], [o.drift[0], tr(o.rest[0], o.rest[1]), 'ease-in-out'], [o.drift[1], tr(o.rest2[0], o.rest2[1])], [o.go, tr(o.rest2[0], o.rest2[1]), 'cubic-bezier(.4,0,.2,1)']];
  S.forEach((s, k) => { cp.push([s, tr(BTN_X[k], HOVER_Y)]); cp.push([L[k], tr(BTN_X[k], HOVER_Y), 'cubic-bezier(.4,0,.2,1)']); });
  cp.push([o.exit[0], tr(o.exitAt[0], o.exitAt[1])]);
  play(c.cur, 'transform', cp);
  play(c.cur, 'opacity', [[o.in - 0.01, 0], [o.in, 0.35], [o.in + 0.15, 1], [o.exit[1], 1], [o.exit[2], 0]]);
  play(c.hand, 'opacity', [[S[0] - 0.01, 0], [S[0], 1], [L[n - 1], 1], [L[n - 1] + 0.01, 0]]);
  play(c.arrow, 'opacity', [[S[0] - 0.01, 1], [S[0], 0], [L[n - 1], 0], [L[n - 1] + 0.01, 1]]);
  const ms = [[0, 500]];
  S.forEach((s, k) => { ms.push([s - 0.001, 500], [s, o.delay(k) ? 500 : 0], [E[k], 0], [L[k], 0], [L[k] + 0.001, 500]); });
  play(c.cur, '--ms', ms);
  // hover squares and tooltips
  S.forEach((s, k) => {
    play(c.sqs[k], 'opacity', [[s - 0.001, 0], [s + 0.05, 1], [L[k], 1], [L[k] + 0.05, 0]]);
    const tp = o.delay(k) ? [[E[k], 0], [E[k] + 0.15, 1]] : [[s - 0.001, 0], [s, 1]];
    const off = k < n - 1 && o.snapOff(k) ? [[S[k + 1] - 0.001, 1], [S[k + 1], 0]] : [[L[k], 1], [L[k] + 0.22, 0]];
    play(c.tips[k], 'opacity', [...tp, ...off]);
  });
  // waiting counter (tenths) and the timeline
  let w = 0; const wp = [[0, 0]];
  S.forEach((s, k) => { const d = o.delay(k); if (d) { wp.push([s, w], [E[k], w + d * 10]); w += d * 10; } });
  play(c.ctr, '--w', wp);
  S.forEach((s, k) => { if (k < c.segs.length) play(c.segs[k], 'width', o.delay(k) ? [[s, px(0)], [E[k], px(84)]] : [[0, px(0)]]); });
  const dur = o.axis[1] - o.axis[0];
  play(c.lab, '--e', [[o.axis[0], 0], [o.axis[1], Math.round(dur * 10)]]);
  play(c.lab, 'transform', [[o.axis[0], `translateX(${px(49)})`], [o.axis[1], `translateX(${px(49 + 168 * dur)})`]]);
  play(c.lab, 'opacity', [[o.axis[0] - 0.01, 0], [o.axis[0], 1]]);
}

if (demo) {
  // top: every hover waits 500 ms (onsets read from the timeline segments at 15.5 s)
  run(cards[0], { starts: [0.8, 1.86, 2.81, 3.77, 4.73, 5.69, 6.65], delay: () => 0.5, snapOff: () => false, lastLeave: 7.65,
    in: 0, rest: [912, 330], rest2: [856, 332], drift: [0.05, 0.5], go: 0.55,
    exit: [7.85, 7.9, 8.2], exitAt: [952, 290], axis: [0.8, 7.7] });
  // bottom: only the first hover waits; later tooltips swap instantly
  run(cards[1], { starts: [9.3, 10.35, 10.8, 11.2, 11.65, 12.1, 12.5], delay: k => k ? 0 : 0.5, snapOff: () => true, lastLeave: 13.22,
    in: 8.3, rest: [912, 330], rest2: [856, 332], drift: [8.35, 8.9], go: 9.02,
    exit: [13.42, 13.6, 14.0], exitAt: [942, 300], axis: [9.3, 13.0] });
  // both cards dim again as the clip loops (15.72–15.92 s, read from the segment colour)
  play(cards[0].content, 'opacity', [[8.0, 1], [8.3, 0.3], [13.4, 0.3], [13.95, 1]], 'ease-in-out');
  // at the loop point the top timeline alone fades while the bottom card dims
  cards[0].segs.forEach(e => play(e, 'opacity', [[15.72, 1], [15.98, 0.25]], 'ease-in-out'));
  play(cards[0].lab, 'color', [[15.72, '#1a1a1a'], [15.98, '#b0b0b0']], 'ease-in-out');
  play(cards[1].content, 'opacity', [[8.0, 0.3], [8.3, 1], [15.72, 1], [15.92, 0.3]], 'ease-in-out');
}
</script></body></html>
