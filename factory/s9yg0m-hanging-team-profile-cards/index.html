<script>
const P = [
  { n: 'Maya Bennett', r: 'Creative Director', pin: 282, top: 362, tilt: -2, bg: '#e8c9de', p: 'maya', loc: 'London, UK', bio: 'Turning interesting ideas into things people remember.', pr: ['Identity / Forma', 'Campaign / Light'], m: 'maya' },
  { n: 'Leo Carter', r: 'Motion Designer', pin: 613, top: 445, tilt: 1, bg: '#ddd7e8', p: 'leo', loc: 'Berlin, DE', bio: 'Making everyday interactions feel a little more alive.', pr: ['Motion / Orbit', 'Launch / Loop'], m: 'leo' },
  { n: 'Noah Williams', r: 'Product Designer', pin: 944, top: 402, tilt: -1, bg: '#e4c07a', p: 'noah', loc: 'New York, US', bio: 'Designing small details that make the big picture work.', pr: ['Product / Atlas', 'System / Mono'], m: 'noah' },
  { n: 'Amina Yusuf', r: 'Brand Designer', pin: 1275, top: 440, tilt: 1.5, bg: '#ddd7e8', p: 'amina', loc: 'Amsterdam, NL', bio: 'Building visual worlds with warmth and a point of view.', pr: ['Brand / Ordinary', 'Editorial / Field'], m: 'amina' }
];
const U = n => `calc(${n} * var(--u))`;
const wireY = x => 303 + 24 * (1 - ((x - 778.5) / 531.5) ** 2);
const SVGNS = 'http://www.w3.org/2000/svg';

// wire with four beads
let d = 'M247 303';
for (let x = 257; x <= 1310; x += 10) d += ` L${x} ${wireY(x).toFixed(2)}`;
const wire = document.getElementById('wire');
wire.innerHTML = `<path d="${d}" fill="none" stroke="#a3a3a3" stroke-width="1.8"/>` +
  P.map(c => `<circle cx="${c.pin}" cy="${wireY(c.pin)}" r="4.6" fill="#d4d4d4" stroke="#bdbdbd" stroke-width="1"/>`).join('');

// QR: three finder squares and a seeded module field
function qr(seed) {
  let s = seed, rnd = () => (s = (s * 16807) % 2147483647) / 2147483647, out = '';
  const N = 25, inF = (x, y) => [[0, 0], [N - 7, 0], [0, N - 7]].some(([a, b]) => x >= a - 1 && x < a + 8 && y >= b - 1 && y < b + 8);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!inF(x, y) && rnd() > .52) out += `M${x} ${y}h1v1h-1z`;
  const f = (a, b) => `<path d="M${a} ${b}h7v7h-7z M${a + 1} ${b + 1}v5h5v-5z" fill-rule="evenodd"/><rect x="${a + 2}" y="${b + 2}" width="3" height="3"/>`;
  return `<svg viewBox="0 0 25 25" shape-rendering="crispEdges"><g fill="#111">${f(0, 0)}${f(18, 0)}${f(0, 18)}<path d="${out}"/></g></svg>`;
}
const arrow = `<svg viewBox="0 0 12 12"><path d="M1.5 10.5 10.5 1.5M5.5 1.5h5v5" fill="none" stroke="#fff" stroke-width="1" stroke-linecap="round"/></svg>`;
const clip = `<svg viewBox="0 0 24 24" style="width:100%;height:100%"><path d="M3 13a9 9 0 0 1 18 0" fill="none" stroke="#adadad" stroke-width="3.8"/><rect x="2" y="12" width="20" height="5" rx="1.5" fill="#c6c6c6"/><circle cx="12" cy="13" r="2" fill="#8e8e8e"/></svg>`;

const holder = document.getElementById('cards');
P.forEach((c, i) => {
  const len = c.top - wireY(c.pin) - 2;
  const el = document.createElement('div');
  el.className = 'hang card';
  el.style.cssText = `left:${U(c.pin - 150)};top:${U(c.top)}`;
  const av = `background-image:var(--patch-${c.p});background-color:${c.bg}`;
  el.innerHTML = `
  <div class="string" style="top:${U(-len)};height:${U(len + 2)}"></div>
  <div class="rest" style="transform:rotate(${c.tilt}deg)">
    <div class="tilt"><div class="flip">
      <div class="face front">
        <div class="row small" style="top:${U(18)}"><span>People · Studio</span><span>#0${i + 1}</span></div>
        <div class="av" style="background:${c.bg}"><i style="${av};transform:rotate(${-c.tilt}deg)"></i></div>
        <div class="name">${c.n}</div><div class="role">${c.r}</div>
        <div class="rule" style="top:${U(352)}"></div>
        <div class="row" style="top:${U(366)}"><span class="vp">VIEW PROFILE</span><span class="go">${arrow}</span></div>
        <div class="sheen"><div class="holo"></div></div>
      </div>
      <div class="face back">
        <div class="holo"></div>
        <div class="t small ph" style="top:${U(23)}">Profile / 0${i + 1}</div>
        <div class="ret"><svg viewBox="0 0 12 14"><path d="M8.5 13.5V4.6a2.8 2.8 0 0 0-5.6 0v1.6M1.2 4.6 2.9 6.6 4.6 4.6" fill="none" stroke="#2a2a2a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="t" style="top:${U(54)};display:flex;gap:${U(10)};align-items:center">
          <div class="thumb" style="${av}"></div><div><div class="bn">${c.n}</div><div class="br">${c.r}</div></div></div>
        <div class="t loc" style="top:${U(106)}">&#8982; ${c.loc}</div>
        <div class="t bio" style="top:${U(126)}">${c.bio}</div>
        <div class="rule" style="top:${U(172)}"></div>
        <div class="t small" style="top:${U(180)}">Selected projects</div>
        <div class="t proj" style="top:${U(194)}"><div>${c.pr[0]}</div><div>${c.pr[1]}</div></div>
        <div class="rule" style="top:${U(312)}"></div>
        <div class="t small" style="top:${U(354)}">Let's connect</div>
        <div class="t mail" style="top:${U(370)}">${c.m}@example.com</div>
        <div class="qr">${qr(97 + i * 131)}</div><div class="scan">SCAN ME</div>
      </div>
    </div></div>
    <div class="clip">${clip}</div>
  </div>`;
  holder.appendChild(el);
});

// pointer: hover tilts toward the pointer and lays the sheen; click flips, one back at a time
const cards = [...document.querySelectorAll('.card')];
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
cards.forEach(card => {
  const tilt = card.querySelector('.tilt');
  tilt.addEventListener('pointermove', e => {
    const r = tilt.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    card.classList.add('hover');
    if (!still) tilt.style.transform = `rotateX(${((.5 - y) * 16).toFixed(2)}deg) rotateY(${((x - .5) * 18).toFixed(2)}deg)`;
    card.querySelectorAll('.holo').forEach(h => { h.style.setProperty('--mx', `${30 + x * 40}%`); h.style.setProperty('--my', `${30 + y * 40}%`); });
  });
  tilt.addEventListener('pointerleave', () => { card.classList.remove('hover'); tilt.style.transform = ''; });
  tilt.addEventListener('click', () => {
    const open = !card.classList.contains('open');
    cards.forEach(c => c.classList.remove('open'));
    if (open) card.classList.add('open');
  });
});

// demo: the clip's own sequence on its own timeline
if (new URLSearchParams(location.search).has('demo') && !still) {
  const T = 13.63, ease = 'cubic-bezier(.45,.05,.25,1)';
  // flips per card: [start, end] in s; each turns 180deg
  const FL = [
    // first flip tracked at y 600: edge-on at 0.13s, ~100deg at 0.15s, open by ~0.33s
    [[0.02, 0.34, [[0.05, 20], [0.1, 76], [0.13, 94], [0.15, 108], [0.2, 132], [0.25, 158], [0.3, 174]]], [0.8, 1.2], [10.6, 11.0], [11.9, 12.3]],
    // second handoff read from 1.88s / 1.98s: Leo ~106deg then ~145deg in; Noah lags, ~70deg then ~139deg
    [[0.8, 1.2], [1.68, 2.16, [[1.76, 30], [1.84, 88], [1.88, 106], [1.98, 145], [2.06, 168]]], [5.5, 5.9], [10.0, 10.4]],
    [[1.72, 2.2, [[1.8, 28], [1.88, 70], [1.92, 92], [1.98, 139], [2.08, 170]]], [2.8, 3.2]],
    [[2.9, 3.3], [3.7, 4.1], [12.9, 13.3]]
  ];
  // hover tilt [t, rotateX, rotateY, sheen]
  const TL = [
    [[0, 3, -4, 0], [0.3, 0, 0, 0], [4.3, 0, 0, 0], [4.75, 5, -12, 0, -7], [5.2, 0, 0, 0]],
    [[1.2, 0, 0, 0], [1.45, 3, -6, 0], [1.75, 0, 0, 0], [6.2, 0, 0, 0], [6.6, -2, -3, 0, 2, 15, 10], [7.0, -7, 4, 0, 5, -38, -30], [8.25, -4, 3, 0, 2.5, -15, -10], [9.6, 0, 0, 0]],
    [[2.2, 0, 0, 0], [2.6, 2, 3, 0], [2.8, 0, 0, 0], [4.2, 0, 0, 0], [4.5, -4, 7, 1, 3], [4.75, -4, 8, 1, 4], [5.0, -3, 5, 1, 2], [5.3, 0, 0, 0]],
    [[4.1, 0, 0, 0], [4.45, 3, -6, 1, 2], [4.75, 5, -8, 1, 3], [5.6, 2, -4, 1], [5.9, 0, 0, 0], [13.2, 0, 0, 0], [13.5, 4, -9, 0, 3]]
  ];
  cards.forEach((card, i) => {
    const flip = card.querySelector('.flip'), tilt = card.querySelector('.tilt'), sheen = card.querySelector('.sheen');
    flip.style.transition = tilt.style.transition = sheen.style.transition = 'none';
    let a = 0; const fk = [{ offset: 0, transform: 'rotateY(0deg)', easing: 'linear' }];
    FL[i].forEach(([s, e, mid]) => {
      fk.push({ offset: s / T, transform: `rotateY(${a}deg)`, easing: mid ? 'linear' : ease });
      if (mid) mid.forEach(([t, g]) => fk.push({ offset: t / T, transform: `rotateY(${a + g}deg)`, easing: 'linear' }));
      a += 180; fk.push({ offset: e / T, transform: `rotateY(${a}deg)`, easing: 'linear' });
    });
    fk.push({ offset: 1, transform: `rotateY(${a}deg)` });
    flip.animate(fk, { duration: T * 1000, fill: 'both' });
    const tf = (x, y, z = 0) => `rotateX(${x}deg) rotateY(${y}deg) rotateZ(${z}deg)`;
    const tk = TL[i].map(([t, x, y, , z]) => ({ offset: t / T, transform: tf(x, y, z), easing: 'ease-in-out' }));
    if (tk[0].offset > 0) tk.unshift({ offset: 0, transform: tf(0, 0) });
    tk.push({ offset: 1, transform: tk[tk.length - 1].transform });
    tilt.animate(tk, { duration: T * 1000, fill: 'both' });
    const sk = TL[i].map(([t, , , o]) => ({ offset: t / T, opacity: o * .9 }));
    if (sk[0].offset > 0) sk.unshift({ offset: 0, opacity: 0 });
    sk.push({ offset: 1, opacity: 0 });
    sheen.animate(sk, { duration: T * 1000, fill: 'both' });
    // the foil drifts with the pointer: [t, ..., hx, hy] in px
    const hk = TL[i].map(([t, , , , , hx = 0, hy = 0]) => ({ offset: t / T, transform: `translate(${U(hx)}, ${U(hy)})`, easing: 'ease-in-out' }));
    if (hk[0].offset > 0) hk.unshift({ offset: 0, transform: `translate(0px, 0px)` });
    hk.push({ offset: 1, transform: hk[hk.length - 1].transform });
    card.querySelectorAll('.holo').forEach(h => h.animate(hk, { duration: T * 1000, fill: 'both' }));
  });
}
