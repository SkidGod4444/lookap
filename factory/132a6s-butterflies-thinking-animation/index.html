<!doctype html>
<!--
  Butterflies Thinking Animation, rebuilt from the clip by sucodee.
  Source: https://x.com/sucodeee/status/2106671284385882304
  Hand fix after the factory: the two scouts fade in a little later, so none shows as the loop restarts.
  Nothing sampled: the type, pill, icon and every butterfly are drawn (original SVG).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thinking...</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; overflow: hidden; background: #fdfdfd; }
  #stage {
    --u: 1px;
    position: relative; width: calc(1160 * var(--u)); height: calc(720 * var(--u));
    background: #fdfdfd; overflow: hidden; font-family: Inter, "SF Pro Display", system-ui, sans-serif;
  }
  #word { position: absolute; left: 0; top: 0; width: calc(1160 * var(--u)); height: calc(720 * var(--u)); }
  #pill {
    position: absolute; left: calc(1055 * var(--u)); top: calc(18 * var(--u));
    width: calc(86 * var(--u)); height: calc(44 * var(--u)); box-sizing: border-box;
    border: calc(1 * var(--u)) solid #eaeaea; border-radius: calc(22 * var(--u)); background: #fff;
    display: flex; align-items: center; justify-content: center; gap: calc(8 * var(--u));
    color: #222; font: 600 calc(15 * var(--u)) / 1 Inter, system-ui, sans-serif; cursor: pointer;
  }
  #pill svg { width: calc(13 * var(--u)); height: calc(14 * var(--u)); display: block; }
  #flock { position: absolute; inset: 0; pointer-events: none; }
  .bf { position: absolute; left: 0; top: 0; opacity: 0; will-change: transform, opacity; }
  .bf svg { display: block; transform: translate(-50%, -50%); overflow: visible; }
  .bf .w { transform-box: view-box; transform-origin: 50% 50%; }
</style>
</head>
<body>
<div id="stage">
  <svg id="word" viewBox="0 0 1160 720" aria-label="Thinking...">
    <text x="220" y="405" textLength="601" lengthAdjust="spacingAndGlyphs"
      font-family="Inter, 'SF Pro Display', system-ui, sans-serif" font-weight="500" font-size="161" fill="#090909">Thinking</text>
    <g fill="#090909">
      <circle cx="848" cy="394.5" r="10.5"/><circle cx="885" cy="394.5" r="10.5"/><circle cx="921.5" cy="394.5" r="10.5"/>
    </g>
  </svg>
  <div id="pill" role="button" aria-label="Download GIF">
    <svg viewBox="0 0 13 14" fill="none" stroke="#2a2a2a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6.5 1.2V9.6M2.8 6.2L6.5 9.8L10.2 6.2M1.6 12.8H11.4"/>
    </svg>
    <span>GIF</span>
  </div>
  <div id="flock"></div>
</div>
<script>
(() => {
  const demo = new URLSearchParams(location.search).has('demo');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const flock = document.getElementById('flock');
  const CYCLE = 4.4, NS = 'http://www.w3.org/2000/svg';
  const U = (n) => `calc(${n.toFixed(2)} * var(--u))`;
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pick = (a) => a[Math.floor(rnd() * a.length)];
  const COLORS = ['#8b46e8', '#f2589f', '#f78a26', '#fbbd24', '#1fc8a8', '#3ee3a6', '#3db6ea', '#6a5cf0'];

  // One flat butterfly: four rounded lobes (upper/lower differ), white highlight per lobe, dark body, two antennae.
  function butterfly(size, up, low) {
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '-20 -20 40 40');
    svg.style.width = U(size); svg.style.height = U(size);
    svg.innerHTML =
      `<g class="w">` +
      `<ellipse cx="-6.2" cy="6.4" rx="6" ry="6.6" fill="${low}" transform="rotate(25 -6.2 6.4)"/>` +
      `<ellipse cx="6.2" cy="6.4" rx="6" ry="6.6" fill="${low}" transform="rotate(-25 6.2 6.4)"/>` +
      `<ellipse cx="-8.4" cy="-4.2" rx="8.6" ry="7.6" fill="${up}" transform="rotate(-20 -8.4 -4.2)"/>` +
      `<ellipse cx="8.4" cy="-4.2" rx="8.6" ry="7.6" fill="${up}" transform="rotate(20 8.4 -4.2)"/>` +
      `<g fill="#fff" opacity=".85"><circle cx="-10" cy="-6" r="1.9"/><circle cx="10" cy="-6" r="1.9"/>` +
      `<circle cx="-7" cy="8" r="1.5"/><circle cx="7" cy="8" r="1.5"/></g></g>` +
      `<g stroke="#2a2433" stroke-linecap="round" fill="none"><path d="M0 -8.5V11" stroke-width="1.7"/>` +
      `<path d="M-.5 -8.5Q-3 -14 -6.5 -16.5M.5 -8.5Q3 -14 6.5 -16.5" stroke-width=".9"/></g>`;
    return svg;
  }

  // Landing spots: dark pixels of the word itself, drawn with the same font on a canvas.
  function glyphPoints() {
    const c = document.createElement('canvas'); c.width = 1160; c.height = 720;
    const g = c.getContext('2d');
    g.font = '500 161px Inter, system-ui, sans-serif';
    const w = g.measureText('Thinking').width;
    g.setTransform(601 / w, 0, 0, 1, 220, 0);
    g.fillText('Thinking', 0, 405);
    g.setTransform(1, 0, 0, 1, 0, 0);
    for (const x of [848, 885, 921.5]) { g.beginPath(); g.arc(x, 394.5, 10.5, 0, 7); g.fill(); }
    const d = g.getImageData(0, 0, 1160, 720).data, pts = [];
    for (let y = 270; y < 445; y += 5) for (let x = 210; x < 940; x += 5)
      if (d[(y * 1160 + x) * 4 + 3] > 200) pts.push([x, y]);
    return pts;
  }

  function add(size, up, low, frames, timing, soft) {
    const el = document.createElement('div'); el.className = 'bf';
    const svg = butterfly(size, up, low); el.appendChild(svg); flock.appendChild(el);
    if (soft) el.style.filter = `blur(${U(soft)})`;
    el.animate(frames, timing);
    const fl = 0.16 + rnd() * 0.14;
    svg.querySelector('.w').animate(
      [{ transform: 'scaleX(1)' }, { transform: 'scaleX(.28)' }, { transform: 'scaleX(1)' }],
      { duration: fl * 1000, iterations: Infinity, delay: -rnd() * fl * 1000, easing: 'ease-in-out' });
  }
  const kf = (t, x, y, r, o, extra) => Object.assign(
    { offset: Math.min(1, Math.max(0, t / CYCLE)), opacity: o,
      transform: `translate(${U(x)}, ${U(y)}) rotate(${r.toFixed(1)}deg)` }, extra || {});

  function build() {
    if (still) return;
    const timing = { duration: CYCLE * 1000, iterations: demo ? 2 : Infinity, fill: 'both' };
    const pts = glyphPoints();
    // order spots left to right so the swarm builds across the word
    const N = 130, spots = [];
    for (let i = 0; i < N; i++) spots.push(pts[Math.floor(rnd() * pts.length)]);
    spots.sort((a, b) => a[0] - b[0]);
    spots.forEach(([tx, ty], i) => {
      const u = (tx - 220) / 702;
      const ra = Math.max(0.3, 0.05 + 0.95 * u + rnd() * 0.25);
      const rl = ra + 0.3 + rnd() * 0.15;
      const rd = Math.min(1.2 + 1.2 * u + rnd() * 0.4, 2.7);
      const re = Math.max(rd + 0.45, Math.min(rd + 0.75 + rnd() * 0.3, 3.15)), rm = (rd + re) / 2;
      const sx = tx - 120 - rnd() * 160, sy = ty + (rnd() - 0.5) * 220;
      // lift mostly straight up first, then bend away up and to the right
      const mx = tx - 20 + rnd() * 100, my = ty - 120 - rnd() * 80;
      const ex = tx + 60 + rnd() * 260, ey = ty - 250 - rnd() * 150;
      const rot = (rnd() - 0.5) * 90, size = 22 + rnd() * 18;
      add(size, pick(COLORS), pick(COLORS), [
        kf(0, sx, sy, rot - 30, 0),
        kf(ra, sx, sy, rot - 30, 0),
        kf(ra + 0.08, sx + (tx - sx) * 0.25, sy + (ty - sy) * 0.25, rot - 25, 1, { easing: 'cubic-bezier(.3,.6,.4,1)' }),
        kf(rl, tx, ty, rot, 1),
        kf(rd, tx + (rnd() - 0.5) * 6, ty + (rnd() - 0.5) * 6, rot, 1, { easing: 'cubic-bezier(.5,0,.7,.9)' }),
        kf(rm, mx, my, 15 + rnd() * 30, 1, { easing: 'ease-in' }),
        kf(re, ex, ey, 35 + rnd() * 30, 0),
        kf(CYCLE, ex, ey, 40, 0)
      ], timing);
    });
    // far-off fliers: smaller, translucent, soft; they cross the word and leave up-right
    for (let i = 0; i < 20; i++) {
      const u = rnd(), y0 = rnd() < 0.5 ? 200 + rnd() * 60 : 450 + rnd() * 80, x0 = 120 + u * 500;
      const ra = 0.35 + u * 0.8 + rnd() * 0.3, re = Math.min(ra + 1.4 + rnd() * 0.6, 3.1);
      const mx = x0 + 120 + rnd() * 120, my = y0 - 40 - rnd() * 60;
      const ex = mx + 200 + rnd() * 200, ey = my - 140 - rnd() * 120, rot = (rnd() - 0.5) * 80;
      add(16 + rnd() * 10, pick(COLORS), pick(COLORS), [
        kf(0, x0, y0, rot, 0),
        kf(ra, x0, y0, rot, 0),
        kf(ra + 0.25, x0 + 30, y0 - 8, rot, 0.55),
        kf((ra + re) / 2, mx, my, rot + 15, 0.5),
        kf(re, ex, ey, rot + 30, 0),
        kf(CYCLE, ex, ey, rot + 30, 0)
      ], timing, 0.6 + rnd() * 0.8);
    }
    // the two scouts: crisp mint butterflies already near 'Th' at 0.15s (one above, one at the h's foot)
    [[[296, 178], [312, 163], [338, 300], 18, -30], [[343, 424], [359, 406], [386, 392], 28, 35]]
      .forEach(([[ax, ay], [bx, by], [tx, ty], size, r]) => add(size, '#3fd6b4', '#7fe8cf', [
        kf(0, ax, ay, r, 0),
        kf(0.07, ax + (bx - ax) * 0.3, ay + (by - ay) * 0.3, r, 0), /* hidden as the loop restarts (the clip is plain text at 4.45 s) */
        kf(0.12, ax + (bx - ax) * 0.6, ay + (by - ay) * 0.6, r, 1),
        kf(0.15, bx, by, r, 1),
        kf(0.7, tx, ty, r * 0.5, 1),
        kf(1.5, tx + 3, ty - 2, r * 0.5, 1, { easing: 'cubic-bezier(.5,0,.7,.9)' }),
        kf(2.0, tx + 60, ty - 150, 30, 1, { easing: 'ease-in' }),
        kf(2.5, tx + 260, ty - 330, 45, 0),
        kf(CYCLE, tx + 260, ty - 330, 45, 0)
      ], timing));
    // the last straggler of the second swarm, still upper right at 8.1s
    if (demo) add(17, '#8b46e8', '#6a5cf0', [
      { offset: 0, opacity: 0, transform: `translate(${U(740)}, ${U(190)}) rotate(20deg)` },
      { offset: 7.25 / 8.6, opacity: 0, transform: `translate(${U(740)}, ${U(190)}) rotate(20deg)` },
      { offset: 7.45 / 8.6, opacity: 1, transform: `translate(${U(770)}, ${U(160)}) rotate(25deg)` },
      { offset: 8.1 / 8.6, opacity: 1, transform: `translate(${U(820)}, ${U(105)}) rotate(30deg)` },
      { offset: 1, opacity: 0, transform: `translate(${U(850)}, ${U(80)}) rotate(30deg)` }
    ], { duration: 8600, fill: 'both' });
  }
  // build at once (so a seek always finds the animations), then rebuild on the real glyphs once Inter
  // is in, carrying over the current time and paused state of the first build
  build();
  if (!document.fonts.check('500 161px Inter')) document.fonts.load('500 161px Inter').then(() => {
    const old = document.getAnimations(), a0 = old[0];
    const t = a0 ? a0.currentTime : 0, paused = a0 && a0.playState === 'paused';
    old.forEach((a) => a.cancel()); flock.replaceChildren(); seed = 7;
    build();
    if (a0) document.getAnimations().forEach((a) => { a.currentTime = t; if (paused) a.pause(); });
  }, () => {});
})();
</script>
</body>
</html>
