<!doctype html>
<!--
  Prism Peel Sticker Effect, after sucodee: https://x.com/sucodeee/status/2104873657885438135
  Rebuilt as one file. Nothing sampled from the clip: the X and G stickers, the MetalForge backing,
  the dot grid, the prism fringe, ripple and halftone are all drawn (inline SVG + CSS).
  The peel is a fold: the part of the sticker between the grabbed corner C and the fold line
  (perpendicular bisector of C and the pointer) is hidden on the flat layer and drawn mirrored
  across the fold as the backing flap. ?demo=1 replays the clip's timeline with element.animate.
-->

<script>
const S=document.getElementById('stage'),NS='http://www.w3.org/2000/svg';
const btns=[...document.querySelectorAll('#ctl button')];
btns.forEach(b=>b.style.color=`color-mix(in srgb,#fff calc(var(--m${b.dataset.m})*100%),#18181b)`);
// ripple displacement map + faint crests: soft rings around the ripple centre, amplitude fading outward
const cr=document.getElementById('crest');let mapStops='';
for(let i=0;i<=240;i++){const o=i/240,amp=Math.max(0,1-o)**1.4,s=Math.sin(o*2*Math.PI*8.5);
  const v=Math.round(128+110*amp*s);mapStops+=`<stop offset="${o}" stop-color="rgb(${v},${v},128)"/>`;
  const st=document.createElementNS(NS,'stop');st.setAttribute('offset',o);st.setAttribute('stop-color',s>0?'#fff':'#000');st.setAttribute('stop-opacity',((s>0?.5:.12)*amp*s*s).toFixed(3));cr.appendChild(st);}

document.getElementById('ripmap').setAttribute('href','data:image/svg+xml,'+encodeURIComponent(map));

const tile=`<svg xmlns="${NS}" width="230" height="230"><g fill="#c0c0c4" font-family="Inter,Helvetica,Arial,sans-serif" font-weight="600" font-size="33" transform="translate(230 0) scale(-1 1) rotate(-2 115 115)"><text x="20" y="70">MetalForge</text><text x="-95" y="185">MetalForge</text><text x="135" y="185">MetalForge</text><text x="250" y="70">MetalForge</text><text x="-210" y="70">MetalForge</text></g></svg>`;
const xd=document.getElementById('xo').getAttribute('d');
const dil=document.getElementById('dil').outerHTML;
const sil={x:`<g transform="translate(355 277) scale(.4583)"><path d="${xd}"/></g>`,g:document.getElementById('gart').innerHTML};
[['bkx','x'],['bkxm','x'],['bkg','g']].forEach(([id,k])=>{const el=document.getElementById(id);
  const m=`url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns="${NS}" viewBox="0 0 1248 1080" width="1248" height="1080">${dil}<g filter="url(#dil)">${sil[k]}</g></svg>`)}")`;
  el.style.webkitMaskImage=m;el.style.maskImage=m;
  el.style.backgroundImage=`linear-gradient(120deg,rgba(255,255,255,.12),rgba(0,0,0,.03) 60%,rgba(255,255,255,.08)),url("data:image/svg+xml,${encodeURIComponent(id=='bkxm'?tile.replace('translate(230 0) scale(-1 1) ',''):tile)}")`;

['stA','stB'].forEach(id=>document.getElementById(id).appendChild(document.querySelector('#flatS .art').cloneNode(true)));
const T=18833,demo=new URLSearchParams(location.search).has('demo');
if(demo){
  const C={TL:[345,262],TR:[920,262],BR:[918,846],GR:[930,505]};
  // [t, corner, angle (deg, direction corner->pointer), f (half the corner-pointer distance)]
  const P=[[0,'TL',45,0],[1.6,'TL',45,0],[1.7,'TL',45,40],[1.8,'TL',45,210],[1.93,'TL',46,340],[2,'TL',43,500],[2.1,'TL',40,620],[2.2,'TL',39,660],
    [2.9,'TL',39,660],[3,'TL',42,560],[3.08,'TL',46,380],[3.2,'TL',45,60],[3.35,'TL',45,40],[4.4,'TL',45,25],[4.48,'TL',45,0],[4.48,'TR',135,0],

  const K=[[0,3,0],[9.7,3,0],[9.7,3,1],[10.85,3,1],[11,4,1],[11.45,4,1],[11.6,5,1],[18.83,5,1]];

  let mode=3,drag=null;const set=(k,v)=>S.style.setProperty(k,v);
  const pt=e=>{const r=S.getBoundingClientRect(),k=1248/r.width;return[(e.clientX-r.left)*k,(e.clientY-r.top)*k]};
  let spring=null;const rm=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
  btns.forEach(b=>b.onclick=()=>{mode=+b.dataset.m;for(let i=1;i<6;i++){const v=+(i===mode),an=S.animate([{['--m'+i]:v}],{duration:rm()?1:180,fill:'forwards',easing:'ease-out'});
    an.onfinish=()=>{set('--m'+i,v);an.cancel()}}});
  const rm2=document.getElementById('ripmap');
  S.addEventListener('pointermove',e=>{const[x,y]=pt(e);set('--mx',x);set('--my',y);
    rm2.setAttribute('x',x-1248);rm2.setAttribute('y',y-1080);cr.setAttribute('cx',x);cr.setAttribute('cy',y);
    set('--ox',Math.max(-5,Math.min(5,(x-632)/45)));set('--oy',Math.max(-5,Math.min(5,(y-556)/45)));
    if(drag){const dx=x-drag[0],dy=y-drag[1];set('--a',Math.atan2(dy,dx)*180/Math.PI);set('--f',Math.hypot(dx,dy)/2)}});
  document.getElementById('hit').addEventListener('pointerdown',e=>{const[x,y]=pt(e);if(spring)spring.cancel();
    const vx=x-632,vy=y-556,l=Math.hypot(vx,vy)||1;drag=[x+vx/l*24,y+vy/l*24];set('--cx',drag[0]);set('--cy',drag[1]);set('--f',0);
    S.setPointerCapture(e.pointerId)});
  S.addEventListener('pointerup',()=>{if(!drag)return;drag=null;const f=parseFloat(getComputedStyle(S).getPropertyValue('--f'))||0;
    spring=S.animate([{'--f':f},{'--f':-6,offset:.7},{'--f':0}],{duration:rm()?1:650,easing:'cubic-bezier(.2,.8,.3,1)'});set('--f',0)});
  document.querySelector('.cap').onclick=()=>set('--g',S.style.getPropertyValue('--g')==='1'?0:1);
}
</script></body></html>
