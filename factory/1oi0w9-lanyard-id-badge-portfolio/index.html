<!doctype html>
<!--
  Lanyard ID Badge Portfolio, design by Sam Cheng
  Source: https://x.com/samfcheng/status/2104993779510047203
  Rebuilt as one file. Nothing sampled: strap, swivel clip, clear holder, card and shadows are drawn
  in CSS / inline SVG. Giant name in Newsreader (opsz 20, 495); corner text in Gelasio. Demo (?demo=1) replays the clip's drags from a pose table read off the clip
  at 10 fps; without it, the badge is a small rope + pendulum simulation you can grab and fling.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sam Cheng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,700&family=Gelasio:wght@400..600&display=swap" rel="stylesheet">
<style id="patches"></style>
<style>
html, body { margin: 0; overflow: hidden; background: #fdfdfd; }
#stage {
  --u: 1px;
  position: relative; width: calc(1556 * var(--u)); height: calc(1080 * var(--u));
  overflow: hidden; background: #fdfdfd; font-family: 'Newsreader', 'Times New Roman', serif;
  color: #060606; -webkit-font-smoothing: antialiased;
}
.corner { position: absolute; top: calc(106 * var(--u)); font-family: 'Gelasio', Georgia, serif; font-size: calc(18.3 * var(--u)); line-height: calc(21 * var(--u)); font-weight: 500; margin: 0; }
.corner.l { left: calc(124 * var(--u)); }
.corner.r { right: calc(118 * var(--u)); text-align: right; }
.corner a { color: #8f8f8f; text-decoration: underline calc(1.6 * var(--u)) #8a8a8a; text-decoration-skip-ink: none; text-underline-offset: calc(2 * var(--u)); }
.giant {
  position: absolute; left: calc(-16 * var(--u)); top: calc(754 * var(--u)); margin: 0;
  font-family: 'Newsreader', Georgia, serif; font-variation-settings: 'opsz' 20; font-size: calc(335 * var(--u)); word-spacing: calc(-12 * var(--u));
  line-height: 1; font-weight: 495; white-space: nowrap; letter-spacing: calc(-1 * var(--u)); color: #060606;
}
.full { position: absolute; left: 0; top: 0; width: calc(1556 * var(--u)); height: calc(1080 * var(--u)); }
svg.full { pointer-events: none; overflow: visible; }
.rig { transform-origin: 0 0; pointer-events: none; will-change: transform; }
.rig > * { position: absolute; }
.bshadow {
  left: calc(-160 * var(--u)); top: calc(110 * var(--u)); width: calc(327 * var(--u)); height: calc(492 * var(--u));
  border-radius: calc(20 * var(--u)); background: rgba(0,0,0,.15); filter: blur(calc(13 * var(--u)));
}
.hold { left: calc(-163 * var(--u)); top: calc(75 * var(--u)); width: calc(327 * var(--u)); height: calc(525 * var(--u)); pointer-events: auto; cursor: grab; }
.hold svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; }
.clip { z-index: 2; left: calc(-22 * var(--u)); top: calc(4 * var(--u)); width: calc(44 * var(--u)); height: calc(132 * var(--u)); overflow: visible; }
.card {
  position: absolute; left: calc(22 * var(--u)); top: calc(87 * var(--u)); width: calc(286 * var(--u)); height: calc(418 * var(--u));
  background: linear-gradient(180deg, #f5f5f5, #f1f1f1); box-shadow: inset 0 0 0 calc(1 * var(--u)) #e6e6e6;
}
.nm { position: absolute; left: calc(19 * var(--u)); top: calc(39 * var(--u)); font-size: calc(88 * var(--u)); line-height: calc(52 * var(--u));
  font-weight: 480; letter-spacing: calc(-2.5 * var(--u)); filter: url(#ink); font-variation-settings: 'opsz' 60; }
.nm span { display: block; }
.nm .b { color: #1a1ae6; margin-top: calc(5 * var(--u)); }
.lab { position: absolute; left: calc(27 * var(--u)); font-size: calc(10.5 * var(--u)); line-height: 1; }
.lab.i { font-style: italic; font-weight: 700; color: #2a2a2a; }
.lab.g { color: #2f2f2f; font-size: calc(11 * var(--u)); font-weight: 400; }
.pills { position: absolute; left: calc(27 * var(--u)); top: calc(379 * var(--u)); display: flex; gap: calc(6.5 * var(--u)); }
.pills b { font-weight: 400; color: #fff; font-size: calc(10 * var(--u)); line-height: calc(15 * var(--u)); padding: 0 calc(5 * var(--u)); border-radius: calc(8 * var(--u)); white-space: nowrap; }
#cur { position: absolute; left: 0; top: 0; width: calc(1556 * var(--u)); height: calc(1080 * var(--u)); transform-origin: 0 0; pointer-events: none; display: none; }
#cur svg { position: absolute; left: calc(-4 * var(--u)); top: calc(-2 * var(--u)); width: calc(24 * var(--u)); height: calc(26 * var(--u)); }
</style>
</head>
<body>
<div id="stage">
  <p class="corner l">I design products and the<br>stories behind them. <a href="#">[more]</a></p>
  <p class="corner r">Currently studying Arts,<br>Technology, &amp; Business @ USC</p>
  <h1 class="giant">Sam Cheng</h1>

  <svg class="full" viewBox="0 0 1556 1080" aria-hidden="true">
    <defs>
      <filter id="sblur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
      <filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="3" seed="4" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.3" xChannelSelector="R" yChannelSelector="G" result="d"/>
        <feGaussianBlur in="d" stdDeviation="0.6" result="b"/>
        <feComponentTransfer in="b"><feFuncA type="table" tableValues="0 0 .7 1 1"/></feComponentTransfer>
      </filter>
    </defs>
    <g transform="translate(30 20)" filter="url(#sblur)"><path id="strapS" d="" fill="none" stroke="rgba(0,0,0,.14)" stroke-width="15"/></g>
  </svg>
  <div class="full rig" id="srig"><div class="bshadow"></div></div>
  <svg class="full" viewBox="0 0 1556 1080" aria-hidden="true">
    <path id="strap" d="" fill="none" stroke="#2e312d" stroke-width="14"/>
  </svg>

  <div class="full rig" id="rig">
    <svg class="clip" viewBox="-22 -6 44 132" aria-hidden="true">
      <defs>
        <linearGradient id="metal" x1="0" x2="1">
          <stop offset="0" stop-color="#4e4e4e"/><stop offset=".22" stop-color="#bdbdbd"/><stop offset=".42" stop-color="#ffffff"/>
          <stop offset=".62" stop-color="#d2d2d2"/><stop offset=".85" stop-color="#7a7a7a"/><stop offset="1" stop-color="#3c3c3c"/>
        </linearGradient>
        <linearGradient id="neck" x1="0" x2="1">
          <stop offset="0" stop-color="#3a3a3a"/><stop offset=".35" stop-color="#9a9a9a"/><stop offset=".55" stop-color="#e6e6e6"/><stop offset="1" stop-color="#454545"/>
        </linearGradient>
        <path id="ring" d="M-14 0 Q-15 -4 -10 -4 L12 -4 Q17 -4 16 0 L15 12 Q14 20 6 20 L-4 20 Q-12 20 -13 12 Z" fill="none"/>
      </defs>
      <!-- wide D-ring (x 764–800, y 290–318): a round silver tube, grey rim outside, bright crest, white highlight -->
      <use href="#ring" stroke="#8c8c8c" stroke-width="4.4"/>
      <use href="#ring" stroke="#d9d9d9" stroke-width="3"/>
      <use href="#ring" stroke="#ffffff" stroke-width="1.3" transform="translate(-.5 -.4)"/>
      <rect x="-9" y="-12" width="21" height="15" rx="2" fill="#2b2d2a"/>
      <rect x="-9" y="1" width="21" height="2" fill="#151515"/>
      <!-- swivel neck (dark ridged), tapering shank, then the long narrow hook loop into the slot -->
      <path d="M-6 21 L8 21 L6.5 35 L-4.5 35 Z" fill="url(#neck)"/>
      <path d="M-5.5 25H7.5M-5 29H7M-4.8 32.5H6.6" stroke="#5a5a5a" stroke-width=".7"/>
      <path d="M-4.5 35 L6.5 35 L5.8 58 L-3.8 58 Z" fill="url(#metal)"/>
      <rect x="-3.6" y="57" width="9.4" height="47" rx="4.7" fill="url(#metal)"/>
      <rect x="-.4" y="61" width="2.8" height="38" rx="1.4" fill="#8a8a8a"/>
      <path d="M-2.4 60V100" stroke="#ffffff" stroke-width="1"/>
    </svg>
    <div class="hold" id="hold">
      <svg viewBox="0 0 327 525" aria-hidden="true">
        <rect x="1" y="1" width="325" height="523" rx="18" fill="rgba(255,255,255,.03)" stroke="#d4d4d4" stroke-width="1.6"/>
        <rect x="8" y="8" width="311" height="509" rx="12" fill="none" stroke="#e4e4e4" stroke-width="1.2"/>
        <rect x="1" y="1" width="325" height="80" rx="18" fill="rgba(255,255,255,.35)"/>
        <circle cx="59" cy="35" r="13.5" fill="rgba(255,255,255,.7)" stroke="#cdcdcd" stroke-width="1.6"/>
        <circle cx="269" cy="35" r="13.5" fill="rgba(255,255,255,.7)" stroke="#cdcdcd" stroke-width="1.6"/>
        <rect x="141" y="24" width="79" height="22" rx="11" fill="rgba(255,255,255,.75)" stroke="#cdcdcd" stroke-width="1.6"/>
        <g stroke="#c6c6c6" stroke-width="1.2" shape-rendering="crispEdges"><path d="M2 63H325M2 67H325M2 71H325M2 75H325"/></g>
        <g stroke="#d8d8d8" stroke-width="1" shape-rendering="crispEdges"><path d="M2 65H325M2 69H325M2 73H325M2 77H325"/></g>
      </svg>
      <div class="card">
        <div class="nm"><span>Sam</span><span class="b">Cheng</span></div>
        <div class="lab i" style="top: calc(308 * var(--u))">Currently</div>
        <div class="lab g" style="top: calc(328 * var(--u))">Design, Tech, &amp; Business @ USC</div>
        <div class="lab i" style="top: calc(362 * var(--u))">Previously</div>
        <div class="pills"><b style="background:#111">Kleiner Perkins Fellows</b><b style="background:#d0091f">Oracle</b><b style="background:#2e078d">Multiply</b></div>
      </div>
    </div>
  </div>

  <div id="cur">
    <svg id="arrow" viewBox="0 0 24 26"><path d="M4 2 L4 20 L8.5 15.5 L11.5 22.5 L14.5 21.2 L11.6 14.3 L18 14.3 Z" fill="#111" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>
    <svg id="hand" viewBox="0 0 24 26"><path d="M7 11 V6 a1.6 1.6 0 0 1 3.2 0 V10 V4.5 a1.6 1.6 0 0 1 3.2 0 V10 V5.5 a1.6 1.6 0 0 1 3.2 0 V11 V8 a1.5 1.5 0 0 1 3 0 V15 q0 7 -6.5 8 h-2.5 q-3.5 0 -5.5 -3.5 L3 15 a1.5 1.5 0 0 1 2.4 -1.8 L7 15 Z" fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></svg>
  </div>
</div>
<script>
(() => {
  const W = 1556, H = 1080, REST = [780, 285];
  const A = [[540, -300], [1028, -300]];
  const L = A.map(a => Math.hypot(REST[0] - a[0], REST[1] - a[1]));
  const rig = document.getElementById('rig'), srig = document.getElementById('srig');
  const strap = document.getElementById('strap'), strapS = document.getElementById('strapS');
  const f = n => Math.round(n * 10) / 10;

  // Each strand is a fixed length; when the clip comes closer than that, the strand sags into a curve.
  function strapD(px, py) {
    let d = '';
    A.forEach(([ax, ay], i) => {
      const dx = px - ax, dy = py - ay, c = Math.hypot(dx, dy) || 1;
      const h = c < L[i] ? Math.sqrt(3 * c * (L[i] - c) / 8) : 0;
      let nx = -dy / c, ny = dx / c;
      if (ny < 0 || (Math.abs(ny) < .05 && (i ? nx < 0 : nx > 0))) { nx = -nx; ny = -ny; }
      d += `M${f(ax)} ${f(ay)}Q${f((ax + px) / 2 + nx * 2 * h)} ${f((ay + py) / 2 + ny * 2 * h)} ${f(px)} ${f(py)}`;
    });
    return d;
  }
  const tf = (x, y, a) => `translate(${(x / W * 100).toFixed(3)}%, ${(y / H * 100).toFixed(3)}%) rotate(${a.toFixed(2)}deg)`;
  function render(x, y, a) {
    rig.style.transform = tf(x, y, a);
    srig.style.transform = tf(x + 22, y + 26, a);
    const d = strapD(x, y);
    strap.setAttribute('d', d); strapS.setAttribute('d', d);
  }

  // Pose of the clip's top (x, y) and the badge angle (deg, CSS clockwise), read from the clip at 10 fps.
  const T = [
    [0,780,285,0],[.45,780,285,0],[.63,778,285,5],[.8,777,285,7],[1,778,285,4],[1.15,770,272,6],[1.3,733,240,12],
    [1.4,714,248,-25],[1.5,705,215,-50],[1.6,640,182,-70],[1.7,625,160,-85],[1.9,700,240,-88],[2.2,720,265,-86],
    [2.5,740,290,-85],[2.8,760,270,-80],[2.9,860,192,-60],[3,910,234,-30],[3.1,896,282,-22],[3.2,880,298,-10],
    [3.3,877,298,0],[3.4,850,298,2],[3.5,812,262,-10],[3.6,803,295,-20],[3.7,780,305,-22],[3.8,742,298,-25],
    [3.9,747,285,-35],[4,733,239,-35],[4.1,719,225,-38],[4.3,680,288,-40],[4.7,742,281,-40],[4.8,747,253,-38],
    [4.9,850,258,-38],[5,765,118,-45],[5.1,770,2,-60],[5.2,780,-28,-75],[5.3,830,-20,-170],[5.4,885,15,-262],
    [5.9,933,38,-268],[6,957,99,-270],[6.2,990,99,-270],[6.5,952,145,-270],[6.6,934,187,-265],[6.7,920,164,-270],
    [6.8,905,187,-295],[6.9,887,263,-300],[7,880,286,-305],[7.1,840,272,-310],[7.2,793,291,-310],[7.3,733,291,-320],
    [7.4,719,291,-355],[7.5,700,291,-370],[7.6,690,291,-385],[7.7,690,291,-392],[7.9,690,286,-395],[8.2,686,286,-397],
    [8.3,789,286,-395],[8.4,840,300,-392],[8.5,850,300,-390],[8.6,859,298,-385],[8.7,887,296,-375],[8.8,920,294,-365],
    [8.9,929,292,-363],[9,887,280,-360],[9.4,840,290,-360],[9.5,789,160,-365],[9.6,770,104,-330],[9.7,733,29,-315],
    [9.8,742,-18,-295],[9.9,607,-28,-275],[10,616,52,-265],[10.1,625,34,-265],[10.2,513,52,-265],[10.4,546,47,-268],
    [10.6,500,47,-268],[10.7,509,47,-268],[10.8,583,11,-270],[10.9,570,34,-280],[11,579,104,-305],[11.1,537,174,-315],
    [11.2,546,174,-320],[11.3,602,197,-330],[11.4,653,193,-335],[11.5,663,239,-345],[11.6,719,263,-355],[11.7,747,286,-360],
    [11.8,780,286,-362],[11.9,812,263,-363],[12,864,240,-365],[12.1,873,244,-370],[12.2,882,244,-375],[12.3,910,258,-385],
    [12.4,896,258,-395],[12.5,905,258,-400],[12.6,840,215,-400],[13.1,836,215,-398],[13.2,817,225,-395],[13.3,803,232,-390],
    [13.4,812,240,-385],[13.5,817,245,-375],[13.6,803,255,-365],[13.7,812,265,-360],[13.8,805,280,-360],[14,789,285,-360],
    [14.2,760,285,-355],[14.3,755,287,-345],[14.4,770,290,-335],[14.6,775,290,-332],[14.9,780,290,-330],[15.2,782,288,-335],
    [15.5,785,286,-345],[15.8,785,285,-352],[16,785,285,-360],[16.3,788,286,-370],[16.5,790,288,-375],[16.75,790,289,-377],
    [17.05,790,289,-377],[17.3,787,287,-372],[17.52,785,286,-370],[17.7,782,285,-366],[17.98,780,285,-360]
  ];
  // Drag windows and the grabbed point in badge-local px (the cursor sits there while it holds).
  const DRAGS = [[.5,1.05,41,529],[1.25,2.85,46,424],[3.45,4.85,10,440],[4.9,6.75,10,440],[8.25,9,10,440],[9.45,10.85,10,440],[12.55,13.15,10,440]];
  function pose(t) {
    let i = 0; while (i < T.length - 2 && T[i + 1][0] <= t) i++;
    const p0 = T[Math.max(i - 1, 0)], p1 = T[i], p2 = T[i + 1], p3 = T[Math.min(i + 2, T.length - 1)];
    const dt = p2[0] - p1[0], u = Math.min(Math.max((t - p1[0]) / dt, 0), 1);
    const h00 = 2*u*u*u - 3*u*u + 1, h10 = u*u*u - 2*u*u + u, h01 = -2*u*u*u + 3*u*u, h11 = u*u*u - u*u;
    return [1, 2, 3].map(k => {
      const m1 = (p2[k] - p0[k]) / (p2[0] - p0[0] || 1) * dt, m2 = (p3[k] - p1[k]) / (p3[0] - p1[0] || 1) * dt;
      return h00 * p1[k] + h10 * m1 + h01 * p2[k] + h11 * m2;
    });
  }
  const local = ([x, y, a], lx, ly) => { const r = a * Math.PI / 180, c = Math.cos(r), s = Math.sin(r); return [x + lx * c - ly * s, y + lx * s + ly * c]; };

  if (new URLSearchParams(location.search).has('demo')) {
    const DUR = 17980, N = Math.round(17.98 * 30), K = { rig: [], srig: [], d: [], cur: [], hand: [], arrow: [] };
    let rel = [1040, 710];
    for (let n = 0; n <= N; n++) {
      const t = n / 30, p = pose(t), d = `path("${strapD(p[0], p[1])}")`, offset = n / N;
      K.rig.push({ offset, transform: tf(...p) }); K.srig.push({ offset, transform: tf(p[0] + 22, p[1] + 26, p[2]) });
      K.d.push({ offset, d });
      const dg = DRAGS.find(([a, b]) => t >= a && t <= b), nx = DRAGS.find(([a]) => a > t);
      let c = rel;
      if (dg) { c = local(p, dg[2], dg[3]); rel = c; }
      else if (nx) {
        // glide from where the last hold ended to the next grab point over the 0.25s before it
        const g = local(pose(nx[0]), nx[2], nx[3]), k = Math.min(Math.max((t - nx[0] + .25) / .25, 0), 1), e = k * k * (3 - 2 * k);
        c = [rel[0] + (g[0] - rel[0]) * e, rel[1] + (g[1] - rel[1]) * e];
      }
      K.cur.push({ offset, transform: `translate(${(c[0] / W * 100).toFixed(3)}%, ${(c[1] / H * 100).toFixed(3)}%)` });
      K.hand.push({ offset, opacity: dg ? 1 : 0 }); K.arrow.push({ offset, opacity: dg ? 0 : 1 });
    }
    const o = { duration: DUR, fill: 'both', easing: 'linear' };
    render(...pose(0));
    rig.animate(K.rig, o); srig.animate(K.srig, o); strap.animate(K.d, o); strapS.animate(K.d, o);
    const cur = document.getElementById('cur'); cur.style.display = 'block';
    cur.animate(K.cur, o); document.getElementById('hand').animate(K.hand, o); document.getElementById('arrow').animate(K.arrow, o);
    return;
  }

  // Interactive: the clip top is a point on two fixed-length strands; the badge is a pendulum hung from it.
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const G = 1900, LEN = 330, stage = document.getElementById('stage');
  let P = [...REST], Pv = [0, 0], ang = 0, av = 0, drag = null;
  const toFrame = e => { const r = stage.getBoundingClientRect(), s = r.width / W; return [(e.clientX - r.left) / s, (e.clientY - r.top) / s]; };
  function rope() {
    A.forEach(([ax, ay], i) => {
      const dx = P[0] - ax, dy = P[1] - ay, c = Math.hypot(dx, dy);
      if (c > L[i]) { P[0] = ax + dx / c * L[i]; P[1] = ay + dy / c * L[i]; }
    });
  }
  document.getElementById('hold').addEventListener('pointerdown', e => {
    const [x, y] = toFrame(e), r = ang * Math.PI / 180, vx = x - P[0], vy = y - P[1];
    drag = { l: [vx * Math.cos(r) + vy * Math.sin(r), -vx * Math.sin(r) + vy * Math.cos(r)], t: [x, y] };
    e.target.setPointerCapture?.(e.pointerId); e.preventDefault();
  });
  addEventListener('pointermove', e => { if (drag) drag.t = toFrame(e); });
  addEventListener('pointerup', () => { drag = null; });
  addEventListener('pointercancel', () => { drag = null; });
  let last = performance.now(), acc = 0;
  function frame(now) {
    acc += Math.min((now - last) / 1000, .05); last = now;
    const dt = 1 / 120;
    while (acc >= dt) {
      acc -= dt;
      const old = [...P], oldV = [...Pv];
      if (drag) {
        const gl = Math.hypot(...drag.l), [tx, ty] = drag.t;
        Pv[1] += G * dt; P[0] += Pv[0] * dt; P[1] += Pv[1] * dt;
        let dx = P[0] - tx, dy = P[1] - ty, c = Math.hypot(dx, dy) || 1;
        P[0] = tx + dx / c * gl; P[1] = ty + dy / c * gl; rope();
        const na = (Math.atan2(ty - P[1], tx - P[0]) - Math.atan2(drag.l[1], drag.l[0])) * 180 / Math.PI;
        let da = na - ang; da -= 360 * Math.round(da / 360);
        av = av * .5 + (da / dt) * .5; ang += da;
      } else {
        Pv[1] += G * dt; Pv[0] *= .995; Pv[1] *= .995;
        P[0] += Pv[0] * dt; P[1] += Pv[1] * dt; rope();
        const ax = ((P[0] - old[0]) / dt - oldV[0]) / dt, ay = ((P[1] - old[1]) / dt - oldV[1]) / dt;
        const r = ang * Math.PI / 180;
        const aa = (-(G - ay) * Math.sin(r) + ax * Math.cos(r)) / LEN * 180 / Math.PI;
        av += (aa - av * (reduce ? 6 : .45)) * dt; ang += av * dt;
      }
      Pv = [(P[0] - old[0]) / dt, (P[1] - old[1]) / dt];
      if (!drag && Math.abs(Pv[0]) + Math.abs(Pv[1]) > 4000) Pv = [Pv[0] * .5, Pv[1] * .5];
    }
    render(P[0], P[1], ang);
    requestAnimationFrame(frame);
  }
  render(...REST, 0);
  requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
</body>
</html>
