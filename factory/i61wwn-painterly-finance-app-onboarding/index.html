<!doctype html>
<!--
  Painterly Finance App Onboarding, rebuilt from the clip by Moiz Arshi
  Source: https://x.com/MoizArshi29/status/2109139298004172909

  Sampled: the painting, as one plate. It is the per-pixel median of the clip's phone region over its 24 s
  (measure/8sxtm9v/source.mp4 at 6 fps): the glass rings keep moving, so the median is the painting with no ring
  in it. The spinner, the three lines of copy and the pill were then painted out of it by mirroring the clean rows
  beside each (the gaps between the lines, the disc around the spinner, the rows above the pill). The frosted
  panel and the soft disc under the spinner are a tint of the painting that cannot be separated from it, so they
  are in the plate. Drawn: the phone, the rings and their lips, the spinner, the copy, the pill.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Painterly Finance App Onboarding</title>

<style>
@property --r { syntax: "<number>"; inherits: false; initial-value: 0; } /* the ring radius in source px: a number, so the keyframes interpolate; --R is it in --u */
html, body { margin: 0; overflow: hidden; background: #fdfdfd; }
#stage { --u: 1px; position: relative; width: calc(1628 * var(--u)); height: calc(1080 * var(--u)); background: #fdfdfd; overflow: hidden; font-family: Inter, system-ui, sans-serif; }

/* the phone is the plate: 314 x 684 at 656,199, corners of 27 */
#phone { position: absolute; left: calc(656 * var(--u)); top: calc(199 * var(--u)); width: calc(314 * var(--u)); height: calc(684 * var(--u)); border-radius: calc(27 * var(--u)); overflow: hidden; isolation: isolate;
  background: var(--plate) calc(-56 * var(--u)) calc(-152 * var(--u)) / calc(426 * var(--u)) calc(916 * var(--u)) no-repeat; }

/* glass rings, measured as frame minus plate by radius: a ring is born at the spinner (156, 451) every 2 s, at
   0.92 s past the even second, and grows at 53 px/s (rings 106 px apart); it is full for 5 s, a fifth as strong at 6 s and gone by 6.4 s
   (frame minus plate at 5.95 s and 6.95 s), so three or four are alive at once. Its lip is a 3 px darker line just inside the rim (about -30 luma over the sky) with
   a faint lighter line of 2.5 px just outside. Inside the rim a band of 10 px, fading out 6 px further in, is the
   glass's edge seen like a fisheye: it shows the painting from a third again as far from the spinner, squeezed.
   Over the hills that is the sky, over the tree the sky, over the floor the foliage, over the sky nothing you can
   see, which is what the clip's rims do. That band is the plate again, shrunk to three quarters about the spinner,
   seen through a soft-edged slice. */
.ring { position: absolute; inset: 0; pointer-events: none; --R: calc(var(--r) * var(--u)); --m: .75; --cx: calc(156 * var(--u)); --cy: calc(451 * var(--u)); animation: ripple 8s linear infinite; }
.ring > i, .ring::after { position: absolute; inset: 0; content: ""; }
.ring > i { background: var(--plate) no-repeat; background-size: calc(426 * var(--u) * var(--m)) calc(916 * var(--u) * var(--m)); background-position: calc(var(--cx) * (1 - var(--m)) - 56 * var(--u) * var(--m)) calc(var(--cy) * (1 - var(--m)) - 152 * var(--u) * var(--m));
  -webkit-mask: radial-gradient(circle at var(--cx) var(--cy), transparent calc(var(--R) - 16 * var(--u)), #000 calc(var(--R) - 10 * var(--u)), #000 calc(var(--R) - 0.5 * var(--u)), transparent calc(var(--R) + 0.5 * var(--u)));
  mask: radial-gradient(circle at var(--cx) var(--cy), transparent calc(var(--R) - 16 * var(--u)), #000 calc(var(--R) - 10 * var(--u)), #000 calc(var(--R) - 0.5 * var(--u)), transparent calc(var(--R) + 0.5 * var(--u))); }
.ring::after { background: radial-gradient(circle at var(--cx) var(--cy), transparent calc(var(--R) - 4.8 * var(--u)), rgba(50,30,10,.18) calc(var(--R) - 3.6 * var(--u)), rgba(50,30,10,.18) calc(var(--R) - 1.2 * var(--u)), transparent calc(var(--R) + 0.1 * var(--u)), rgba(255,255,255,.07) calc(var(--R) + 0.8 * var(--u)), rgba(255,255,255,.07) calc(var(--R) + 2.5 * var(--u)), transparent calc(var(--R) + 4 * var(--u))); }
@keyframes ripple {
  0%    { --r: 0; opacity: 1; }
  62.5% { opacity: 1; }
  75%   { opacity: .2; }
  80%   { opacity: 0; }
  100%  { --r: 424; opacity: 0; }
}
.ring:nth-child(1) { animation-delay: -7.08s; }
.ring:nth-child(2) { animation-delay: -5.08s; }
.ring:nth-child(3) { animation-delay: -3.08s; }
.ring:nth-child(4) { animation-delay: -1.08s; }

/* spinner: nine 4 px spokes from radius 6 to 21.5 about (156.5, 451.5), 40 deg apart, the first 8 deg past 12 o'clock */
#spin { position: absolute; left: calc(156.5 * var(--u)); top: calc(451.5 * var(--u)); width: 0; height: 0; animation: spin 1s steps(9) infinite; }
#spin i { position: absolute; left: calc(-2 * var(--u)); top: calc(-21.5 * var(--u)); width: calc(4 * var(--u)); height: calc(15.5 * var(--u)); border-radius: calc(0.8 * var(--u)); background: #fff; transform-origin: calc(2 * var(--u)) calc(21.5 * var(--u)); transform: rotate(calc(-8deg + var(--k) * 40deg)); }
@keyframes spin { to { transform: rotate(360deg); } }

/* copy: three centred lines, Inter 13 on 19, cap tops at 505, 524, 543, letters 0.15 px tighter than Inter sets them */
#copy { position: absolute; left: 0; top: calc(501 * var(--u)); width: calc(314 * var(--u)); text-align: center; color: #fff; font-size: calc(13 * var(--u)); line-height: calc(19 * var(--u)); font-weight: 400; letter-spacing: calc(-0.15 * var(--u)); -webkit-font-smoothing: antialiased; }

/* pill: 277 x 44 at 18,626, label Inter 13 medium */
#cta { position: absolute; left: calc(18 * var(--u)); top: calc(626 * var(--u)); width: calc(277 * var(--u)); height: calc(44 * var(--u)); border: 0; border-radius: calc(22 * var(--u)); background: #fdfdfd; color: #0a0a0a; font: 500 calc(13 * var(--u)) / 1 Inter, system-ui, sans-serif; letter-spacing: calc(-0.1 * var(--u)); cursor: pointer; padding: 0; transition: background .15s, transform .12s; }
#cta:hover { background: #f1f1f1; }
#cta:active { transform: scale(.98); background: #e9e9e9; }

@media (prefers-reduced-motion: reduce) {
  .ring, #spin { animation-play-state: paused; }
  #cta { transition: none; }
}
</style>
