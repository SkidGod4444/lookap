    <rect x="3" y="14" width="82" height="9" rx="4.5" fill="#dadada" stroke="#a3a3a3" stroke-width=".8"/>
    <path d="M4 19 H84 L80 90 Q79 97 72 97 H16 Q9 97 8 90Z" fill="url(#tb)"/>
    <path d="M4 19 H84 L80 90 Q79 97 72 97 H16 Q9 97 8 90Z" fill="url(#tv)"/>
    <path d="M6 20 H82" stroke="#f5f5f5" stroke-width="1.2" opacity=".8"/>
  </svg>
  <div id="word"></div>
  <div id="big"><i class="tab"></i><i class="back"></i><i class="paper"></i><i class="front"></i></div>
  <div class="copy">© Humansongs, Inc. 2026</div>
  <div id="dim"></div>
  <div id="win">
    <div class="bar"><i class="dot r"></i><i class="dot y"></i><i class="dot g"></i>yc-demoday.mov</div>
    <div id="vid"><div id="vblack">
      <div class="h1">HeyClicky</div>
      <div class="h2">Farza <em>Majeed</em></div>
      <div class="inset"></div>
      <svg viewBox="0 0 26 21"><path d="M1 7 H5 L11 2 V19 L5 14 H1Z" fill="#fff" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/><path d="M15 6.5 Q17.5 10.5 15 14.5 M19 3.5 Q23.5 10.5 19 17.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
    </div></div>
  </div>
  <svg id="cur" viewBox="0 0 26 30"><path d="M8 2.5 Q10.5 1 12 3 V12 L13 11.5 Q15 10.5 16 12 L17 11.6 Q19 11 20 13 L21 12.8 Q23.5 12.5 24 15 V21 Q24 27 18.5 28.5 H12 Q8.5 28 6 24 L1.8 16.5 Q1.2 14 3.6 13.8 Q5.2 14 6 15.6 L8 18.5Z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 17 V22 M16 17 V22 M20 17 V22" stroke="#111" stroke-width="1.1"/></svg>
</div>
<script>
// CREDIT: Clicky — see brief.json source link.
const U = n => `calc(${n} * var(--u))`;
const ROW = r => 664 + 32.7 * r;
const L = (x, ...rows) => rows.map(r => [x, r]);
const TILES = [
  // h
  ...L(290, 0, 1, 2, 3, 4, 5, 6), [322, 3], [354, 2], [388, 2], ...L(418, 3, 4, 5, 6),
  // e
  ...L(483, 3, 4, 5), [516, 2], [548, 2], [580, 2], ...L(613, 3, 4), [516, 4], [548, 4], [580, 4], [516, 6], [548, 6], [580, 6],
  // y
  ...L(672, 2, 3, 4), [702, 5], [735, 5], [766, 4], ...L(798, 2, 3, 4, 5, 6, 7), [672, 7], [702, 8], [735, 8], [770, 8],
  // c
  ...L(862, 3, 4, 5), [892, 2], [924, 2], [956, 2], [988, 3], [892, 6], [924, 6], [956, 6], [988, 5],
  // l
  [1051, 0], ...L(1082, 0, 1, 2, 3, 4, 5, 6), [1051, 6], [1118, 6],
  // i
  [1209, 0], [1177, 2], ...L(1209, 2, 3, 4, 5, 6), [1177, 6], [1245, 6],
  // c
  ...L(1305, 3, 4, 5), [1338, 2], [1370, 2], [1400, 2], [1432, 3], [1338, 6], [1370, 6], [1400, 6], [1432, 5],
  // k
  ...L(1495, 0, 1, 2, 3, 4, 5, 6), [1588, 3], [1620, 2], [1556, 4], [1588, 5], [1620, 6],
  // y
  ...L(1682, 2, 3, 4), [1712, 5], [1745, 5], [1778, 4], ...L(1810, 2, 3, 4, 5, 6, 7, 8), [1682, 7], [1715, 8], [1748, 8], [1780, 8],
].sort((a, b) => a[1] - b[1] || a[0] - b[0]);

const word = document.getElementById('word');
const tiles = TILES.map(([x, r]) => {
  const el = document.createElement('div');
  el.className = 't';
  el.style.left = U(x); el.style.top = U(ROW(r));
  el.innerHTML = '<i class="tab"></i><i class="back"></i><i class="paper"></i><i class="front"></i>';
  word.appendChild(el);
  return { el, cx: x + 28, cy: ROW(r) + 24 };
});

const R = 122;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage = document.getElementById('stage');
const dim = document.getElementById('dim'), win = document.getElementById('win'), vblack = document.getElementById('vblack'), vid = document.getElementById('vid');
const demo = new URLSearchParams(location.search).has('demo');

// window open/close, relative to the click (delay in s)
function openWin(d = 0) {
  const o = { delay: d * 1000, fill: 'both' };
  dim.animate([{ opacity: 0 }, { opacity: .72, offset: .36 }, { opacity: 1 }], { ...o, duration: 330, easing: 'ease-in-out' });
  // the clip's backdrop is still sharp at 4.67 s; the blur arrives after the dim
  const B = n => `blur(${U(n)})`;
  dim.animate([{ backdropFilter: B(0) }, { backdropFilter: B(0), offset: .4 }, { backdropFilter: B(5) }], { ...o, duration: 450 });
  win.animate([
    { opacity: 0, transform: `translate(${U(420)}, ${U(200)}) scale(.55)` },
    { opacity: .58, transform: `translate(${U(229)}, ${U(87)}) scale(.769)`, offset: .23, easing: 'ease-out' },
    { opacity: 1, transform: 'none' }
  ], { ...o, duration: reduce ? 1 : 530 });
  // video area: light grey until 4.95 s, #505050 at 5.08 s, black by 5.3 s (clip --hex at 700,150)
  const V = (c, f) => ({ backgroundColor: c, offset: f });
  vid.animate([V('#e7e7e9', 0), V('#e7e7e9', .47), V('#bebec1', .53), V('#767676', .576), V('#505050', .624), V('#272727', .682), V('#0b0b0b', .765), V('#000', .88), V('#000', 1)], { ...o, duration: reduce ? 1 : 850 });
  vblack.animate([{ opacity: 0 }, { opacity: 0, offset: .5 }, { opacity: 1, offset: .6 }, { opacity: 1 }], { ...o, duration: reduce ? 1 : 850 });
  dim.classList.add('on');
}
function closeWin(d = 0) {
  const o = { delay: d * 1000, fill: 'forwards', easing: 'ease-out' };
  dim.animate([{ opacity: 1 }, { opacity: .4, offset: .33 }, { opacity: .12, offset: .6 }, { opacity: 0 }], { ...o, duration: 300 });
  win.animate([{ opacity: 1 }, { opacity: .5, offset: .33 }, { opacity: .15, offset: .6 }, { opacity: 0, offset: .83 }, { opacity: 0 }], { ...o, duration: 300 });
  dim.classList.remove('on');
}

if (demo) {
  // the clip's pointer over the wordmark (x, y at t s); off-word stretches park outside the radius
  const P = [[0, 1205, 1050], [.5, 1205, 1050], [.6, 959, 894], [.7, 900, 849], [.8, 885, 829], [1.1, 885, 829], [1.2, 765, 823],
    [1.3, 551, 810], [1.4, 473, 778], [1.6, 430, 797], [1.7, 454, 823], [1.8, 596, 810], [1.9, 797, 790], [2.0, 907, 778],
    [2.1, 1040, 765], [2.2, 1100, 765], [2.3, 1108, 770], [2.4, 1250, 797], [2.5, 1277, 797], [2.7, 1300, 797], [2.8, 1374, 797],
    [2.9, 1555, 797], [3.0, 1704, 797], [3.1, 1782, 810], [3.3, 1769, 862], [3.4, 1672, 920], [3.5, 1322, 875], [3.6, 635, 855],
    [3.7, 907, 862], [3.8, 1056, 765], [3.9, 1393, 765], [4.0, 1730, 700], [4.1, 1853, 680], [4.2, 1879, 680], [4.4, 1960, 700],
    [7.0, 1960, 700], [7.1, 1100, 740], [7.2, 991, 745], [7.3, 875, 765], [7.4, 680, 785], [7.5, 630, 780], [7.6, 596, 778],
    [7.7, 1866, 65], [8.6, 1866, 65]];
  const at = t => {
    let i = 0; while (i < P.length - 2 && P[i + 1][0] <= t) i++;
    const [t0, x0, y0] = P[i], [t1, x1, y1] = P[i + 1], k = Math.min(1, Math.max(0, (t - t0) / (t1 - t0)));
    return [x0 + (x1 - x0) * k, y0 + (y1 - y0) * k];
  };
  const D = 8.58, dt = .1;
  if (!reduce) for (const tl of tiles) {
    const kf = [{ '--o': 0, offset: 0 }]; let s = 0;
    for (let t = 0; t <= D; t += dt) {
      const [x, y] = at(t), n = Math.hypot(x - tl.cx, y - tl.cy) < R ? 1 : 0;
      if (n !== s) { kf.push({ '--o': s, offset: t / D }, { '--o': n, offset: Math.min(1, (t + .09) / D) }); s = n; }
    }
    kf.push({ '--o': s, offset: 1 });
    tl.el.style.transition = 'none';
    if (kf.length > 2) tl.el.animate(kf, { duration: D * 1000, fill: 'both' });
  }
  // the clip's pointer turns into a hand over the big folder for the click (4.3–4.85 s)
  const cur = document.getElementById('cur'); cur.style.display = 'block';
  cur.animate([{ opacity: 0 }, { opacity: 0, offset: 4.3 / D }, { opacity: 1, offset: 4.31 / D }, { opacity: 1, offset: 4.85 / D }, { opacity: 0, offset: 4.86 / D }, { opacity: 0 }], { duration: D * 1000, fill: 'both' });
  openWin(4.55);
  closeWin(6.1);
} else {
  stage.addEventListener('pointermove', e => {
    const b = stage.getBoundingClientRect(), s = b.width / 2158;
    const x = (e.clientX - b.left) / s, y = (e.clientY - b.top) / s;
    for (const tl of tiles) tl.el.style.setProperty('--o', Math.hypot(x - tl.cx, y - tl.cy) < R ? 1 : 0);
  });
  stage.addEventListener('pointerleave', () => tiles.forEach(tl => tl.el.style.setProperty('--o', 0)));
  document.getElementById('big').addEventListener('click', () => openWin(0));
  dim.addEventListener('click', () => closeWin(0));
}
</script>
