<style>

67.568%{transform:translate(calc(212*var(--u)),calc(120.2*var(--u)));animation-timing-function:var(--fast)}
74.324%{transform:translate(calc(250*var(--u)),calc(141.75*var(--u)));animation-timing-function:linear}
83.108%{transform:translate(calc(258*var(--u)),calc(146.29*var(--u)));animation-timing-function:var(--fast)}
93.919%{transform:translate(calc(312*var(--u)),calc(176.9*var(--u)));animation-timing-function:linear}
97.973%{transform:translate(calc(318*var(--u)),calc(180.31*var(--u)));animation-timing-function:linear}
100%{transform:translate(calc(324*var(--u)),calc(183.71*var(--u)))}}
.mouth{position:absolute;inset:0;clip-path:polygon(calc(620*var(--u)) calc(720*var(--u)),calc(682*var(--u)) calc(685*var(--u)),calc(682*var(--u)) calc(728*var(--u)),calc(620*var(--u)) calc(763*var(--u)))}

<script>
// iso plane: local x along e1 (down-right), local y along e2 (down-left); screen up is -y
const A=0.87,B=0.493, P=(x,y)=>`matrix(${A},${B},${-A},${B},${x},${y})`;
const R=(x,y)=>`matrix(${A},${-B},0,1,${x},${y})`;   // upright panel facing down-right (along -e2)
const L=(x,y)=>`matrix(${A},${B},0,1,${x},${y})`;    // upright panel facing down-left (along e1)
const OL='#c3c6ca', SIDE='#e6e8ea';
const ICON={grey:['#7b8590','HTM'],red:['#e5252a','PDF'],doc:['#1f6fe0','DOC'],black:['#1b1f24','∧'],xls:['#13774a','XLS'],blue:['#1a7fe8','ZIP'],check:['#1a8cf0','']};
const UP=`matrix(${.5/A},${-.5/A},${.5/B},${.5/B},0,0)`; // undoes P so a tick reads upright on screen
function icon(kind,s=1.4){const [c,t]=ICON[kind];
  let g=`<g transform="scale(${s})"><path d="M-7 -8h9l5 5v11h-14z" fill="${c}"/><path d="M2 -8v5h5" fill="#fff" opacity=".45"/>`;
  if(kind==='check') g=`<g transform="scale(${s*1.05})"><path d="M-8 -8h11l5 5v11h-16z" fill="#1a8cf0"/><path d="M3 -8v5h5z" fill="#0d6fd0"/><g transform="${UP}"><path d="M-3.4 -.3l2.2 2.4 4.6-5" fill="none" stroke="#52e06a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g>`;
  else g+=`<text x="0" y="5" text-anchor="middle" font-family="Inter" font-weight="700" font-size="${kind==='black'?7:4.6}" fill="#fff">${t}</text>`;
  return g+'</g>';}
function tile(x,y,kind,s=31,h=5,side='#dcdfe2',edge='#b8bcc1'){const r=s/2;
  return `<g transform="translate(0,${h})"><g transform="${P(x,y)}"><rect x="${-r}" y="${-r}" width="${s}" height="${s}" rx="5" fill="${side}" stroke="${edge}" stroke-width="1.1"/></g></g>`+
    `<g transform="${P(x,y)}"><rect x="${-r}" y="${-r}" width="${s}" height="${s}" rx="5" fill="#fff" stroke="${edge}" stroke-width="1.1"/>${kind?icon(kind):''}</g>`;}
function slab(x,y,x0,x1,w,h){ // belt top face from x0..x1 along e1, width w across, side thickness h
  return `<g transform="translate(0,${h})"><g transform="${P(x,y)}"><rect x="${x0}" y="${-w/2}" width="${x1-x0}" height="${w}" fill="${SIDE}" stroke="${OL}" stroke-width=".8"/></g></g>`+
    `<path d="M${x+x0*A+w/2*A},${y+x0*B-w/2*B}" />`+
    `<g transform="${P(x,y)}"><rect x="${x0}" y="${-w/2}" width="${x1-x0}" height="${w}" fill="#fff" stroke="${OL}" stroke-width=".8"/></g>`;}
function block(x,y,lx,ly,h,r=6){ // box: top face local [0,lx]x[-ly,0] at screen (x,y) = left corner, height h
  const bx=x+lx*A, by=y+lx*B, tx=x+ly*A, ty=y-ly*B, rx=bx+ly*A, ry=by-ly*B;
  return `<path d="M${x},${y}L${bx},${by}L${bx},${by+h}L${x},${y+h}Z" fill="#e5e6e8" stroke="${OL}" stroke-width=".9" stroke-linejoin="round"/>`+
    `<path d="M${bx},${by}L${rx},${ry}L${rx},${ry+h}L${bx},${by+h}Z" fill="#f3f4f5" stroke="${OL}" stroke-width=".9" stroke-linejoin="round"/>`+
    `<g transform="${P(x,y)}"><rect x="0" y="${-ly}" width="${lx}" height="${ly}" rx="${r}" fill="#fff" stroke="${OL}" stroke-width=".9"/></g>`;}
const order=['grey','red','doc','black','xls','blue'];
// input belt: red tile centre (367,562) at 1.9s; base = that minus the belt offset at 1.9s (89.2, 50.6)
let s=slab(361,559,-330,215,52,8); document.getElementById('beltIn').innerHTML=s;
s=''; for(let i=-10;i<=5;i++) s+=tile(277.8+54*i,505.4+30.6*i,order[((i+1)%6+6)%6]);
document.getElementById('tilesIn').innerHTML=s;
// output belt: tile in the mouth at (661,732) at 1.9s; inside the opening the same tiles show green
document.getElementById('beltOut').innerHTML=slab(654,737,12,560,52,8);
s=''; let g=''; for(let i=-6;i<=9;i++){s+=tile(571.8+54*i,681.4+30.6*i,'check');
  // the lime is emitted by the tile: a blurred lime field rides with it, so the opening is pale at 2.4s and full lime at 2.95s
  g+=`<g transform="${P(571.8+54*i,681.4+30.6*i)}"><rect x="-21" y="-21" width="42" height="42" rx="8" fill="#c3f033" opacity=".85" filter="url(#emit)"/><rect x="-15.5" y="-15.5" width="31" height="31" rx="5" fill="#d2f64a" stroke="#b5e43a" stroke-width="1.5"/><rect x="-11.5" y="-11.5" width="23" height="23" rx="2.5" fill="#05d43c"/><g transform="${UP}"><path d="M-5 0l3 3.5 6.5-7" fill="none" stroke="#7ee870" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></g>`;}
document.getElementById('tilesOut').innerHTML=s; document.getElementById('tilesMouth').innerHTML=`<defs><filter id="emit" x="-.5" y="-.5" width="2" height="2"><feGaussianBlur stdDeviation="4.5"/></filter></defs>`+g; document.getElementById('tilesFront').innerHTML=s;
// props
const W='fill="none" stroke="#b9bcc0" stroke-width="1"';
let p=`<g ${W}><path d="M556 726v36l69 60-120 72"/><path d="M453 837v14l50 43"/><path d="M689 691v26"/>
  <path d="M719 592v14l30 17-33 27 33 22-16 12 12 9-45 26-11-6v-12"/>
  <path d="M839 734v40" stroke-dasharray="2 3"/></g>
  <ellipse cx="846" cy="792" rx="24" ry="5" transform="rotate(-28 846 792)" fill="#cfd2d6" opacity=".55" filter="url(#soft2)"/>`;
p+=tile(214,560,'grey',30);
p+=tile(570,555,'xls',30);
// paper stack: mid-grey sheet edges (#bec1c2) every 3px, per the 1.9s column at x=330
for(let k=0;k<14;k++) p+=`<g transform="translate(0,${-k*3})">${tile(341,697,null,34,3,'#bec1c2','#a9adb0')}</g>`;
p+=`<g transform="${P(341,658)}">${icon('blue',1.6)}</g>`;
// mail station: thick rounded base, big grey envelope, upright blue screen with two green squares
p+=block(692,566,66,67,18,10);
p+=`<g transform="${P(728,566)}"><rect x="-13" y="-10" width="26" height="20" rx="2.5" fill="#9ea4aa"/><path d="M-13 -10l26 20M13 -10l-26 20" stroke="#e9ecee" stroke-width="1.6"/></g>`;
p+=`<circle cx="719" cy="592" r="2.2" fill="#6d7378"/>`;
p+=`<g transform="${L(744,540)}"><rect x="0" y="-33" width="55" height="33" rx="2.5" fill="#e7e9eb" stroke="${OL}"/><rect x="1.5" y="-31.5" width="51" height="30" rx="2" fill="url(#scr)"/>
  <rect x="7" y="-27" width="6" height="6" rx="1.2" fill="#46c46e" stroke="#e8f4ff" stroke-width="1"/><rect x="7" y="-17" width="6" height="6" rx="1.2" fill="#46c46e" stroke="#e8f4ff" stroke-width="1"/></g>`;
// check tablet: grey side edge, blue face, thin green ring round a green check
p+=`<g transform="${R(809,733)}"><rect x="0" y="-55" width="4" height="55" fill="#c9ccd0"/></g>`;
p+=`<g transform="${R(812,732)}"><rect x="0" y="-55" width="56" height="55" rx="2.5" fill="#e3e6e9" stroke="${OL}"/><rect x="1.5" y="-53.5" width="53" height="52" rx="2" fill="url(#scr)"/>
  <circle cx="28" cy="-28" r="15" fill="none" stroke="#4fe36b" stroke-width="1" opacity=".9"/>
  <path d="M20 -27l6 7 10-15" fill="none" stroke="#3fdc5a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>`;
// upload station: thick base, large yellow bolt, upright screen with a green 100% ring
p+=block(428,802,68,63,20,10);
p+=`<circle cx="453" cy="837" r="2.2" fill="#6d7378"/>`;
p+=`<g transform="${P(468,800)} scale(1.4)"><path d="M-14 -3h14l-4 -6 18 9h-14l4 6z" fill="#f2bf26"/></g>`;
p+=`<g transform="${L(480,793)}"><rect x="0" y="-46" width="55" height="46" rx="2.5" fill="#e7e9eb" stroke="${OL}"/><rect x="1.5" y="-44.5" width="51" height="43" rx="2" fill="url(#scr)"/>
  <circle cx="26" cy="-24" r="13" fill="none" stroke="#7ce98c" stroke-width="2.6"/><circle cx="26" cy="-24" r="15.5" fill="none" stroke="#c9f5cf" stroke-width="1"/>
  <text x="26" y="-21.5" text-anchor="middle" font-family="Inter" font-weight="700" font-size="7" fill="#fff">100%</text>
  <circle cx="46" cy="-7" r="2" fill="none" stroke="#fff" stroke-width="1"/></g>`;
// machine
p+=block(528,674,84,112,52,9);
// badge lies in the top face: black rounded square, white "b"; green glowing arrows above and below along e1
p+=`<g transform="${P(612,662)}"><g filter="url(#soft2)" fill="#c2f5b4"><rect x="-37" y="-7" width="20" height="14" rx="7"/><rect x="17" y="-7" width="20" height="14" rx="7"/></g>
  <g fill="none" stroke="#2fc94f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(-27,0) ${UP}"><path d="M-4.5 0h9M2 -2.5l2.5 2.5-2.5 2.5"/></g><g transform="translate(27,0) ${UP}"><path d="M-4.5 0h9M2 -2.5l2.5 2.5-2.5 2.5"/></g></g>
  <rect x="-15" y="-15" width="30" height="30" rx="7" fill="#1f2a32"/>
  <text transform="rotate(-90)" x="0" y="8" text-anchor="middle" font-family="Inter" font-weight="700" font-size="24" fill="#fff">b</text></g>
  <circle cx="678" cy="657" r="3.6" fill="#5cc263" stroke="#3f9a49" stroke-width=".8"/>`;
p+=`<circle cx="556" cy="726" r="2" fill="#6d7378"/><circle cx="689" cy="691" r="1.8" fill="#6d7378"/>`;
// mouth opening on the right face: white left reveal, lime interior brightest at the floor, no outline
p+=`<path d="M617 721L622 719V762L617 765Z" fill="#fff"/><path d="M620 720L682 685V728L620 763Z" fill="url(#mouthG)"/>`;
document.getElementById('props').innerHTML=`<defs><linearGradient id="scr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8cc8ff"/><stop offset="1" stop-color="#1f86f2"/></linearGradient>
  <linearGradient id="mouthG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d2e3a6"/><stop offset=".25" stop-color="#d5ea96"/><stop offset=".6" stop-color="#ccE28d"/><stop offset=".75" stop-color="#e8fba6"/><stop offset="1" stop-color="#eef9c4"/></linearGradient>
